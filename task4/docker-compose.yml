version: "3.9"

services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: patients
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: secret

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patients"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

  api:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    

volumes:
  postgres_data: